<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | RuangBiru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">RuangBiru</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li><li class="nav-item"><a class="nav-link" href="artikel.html">Artikel</a></li><li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li><li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li></ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Masuk ke RuangBiru</h1>
          <p class="text-muted">Gunakan email dan kata sandimu.</p>
          <div id="pesan" role="alert"></div>
          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="nama@contoh.com">
              <div class="invalid-feedback" id="errEmail"></div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Kata sandi</label>
              <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
              <div class="invalid-feedback" id="errPassword"></div>
            </div>
            <button type="submit" class="btn btn-accent w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="footer py-4 mt-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>&copy; 2026 RuangBiru. Tugas UTS Pemrograman Web.</span>
    <span><a href="index.html">Beranda</a> &middot; <a href="artikel.html">Artikel</a> &middot; <a href="tentang.html">Tentang</a> &middot; <a href="login.html">Login</a></span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
